<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profilbild – Eugens Schach Arena</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08182a;color:#f5d393;font:16px system-ui}main{width:min(420px,calc(100% - 40px));padding:24px;background:#122c48;border:1px solid #ae8547;border-radius:18px;text-align:center}h1{font-size:25px}.avatar{width:150px;height:150px;border:4px solid #d5a661;border-radius:50%;object-fit:cover;background:#213e60;display:block;margin:18px auto}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border-radius:9px;font:inherit}input{background:#071a30;color:#fff;border:1px solid #6682a5}button{border:0;background:#d5a661;color:#10243c;font-weight:bold;cursor:pointer}button.secondary{background:#344c68;color:white}p{font-size:14px;color:#dce6f5}a{color:#ffe0a2}
</style></head><body><main><h1>♟ Profilbild ändern</h1><img class="avatar" id="preview" alt="Profilbild" src="/avatar-placeholder.svg"><p id="status">Bitte anmelden.</p><section id="login"><input id="name" placeholder="Spielername" autocomplete="username"><input id="password" placeholder="Passwort" type="password" autocomplete="current-password"><button id="signIn">Anmelden</button></section><section id="editor" hidden><p id="who"></p><input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/*"><p>Bild verschieben und zoomen, bevor du es speicherst.</p><input type="range" id="zoom" min="1" max="3" step=".05" value="1"><canvas id="crop" width="256" height="256" style="max-width:100%;touch-action:none;border-radius:50%;border:3px solid #d5a661;background:#233951"></canvas><button id="save">Foto speichern</button><p id="saveStatus" role="status" aria-live="polite" style="min-height:22px;margin:8px 0 16px;font-weight:700;color:#ffe0a2"></p><button id="remove" class="secondary">Foto entfernen</button><button id="logout" class="secondary">Abmelden</button></section><p><a href="/">Zurück zur Arena</a></p></main><script>
'use strict';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('arena_avatar_token')||'', me=null,source=null,offsetX=0,offsetY=0,scale=1,drag=null;
const say=s=>{$('status').textContent=s;const n=$('saveStatus');if(n)n.textContent=s;};
async function api(action,body){const r=await fetch('/api/avatar/'+action,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body||{})});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Anfrage fehlgeschlagen');return x;}
function show(){ $('login').hidden=!!me;$('editor').hidden=!me;if(me){$('who').textContent='Angemeldet: '+me.name;$('preview').src='/api/avatar/image/'+encodeURIComponent(me.code)+'?v='+Date.now();}}
async function refresh(){const r=await api('profile');me=r.profile;show();say('Du kannst dein rundes Profilbild ändern.');}
$('signIn').onclick=async()=>{try{const r=await fetch('/api/friends/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),password:$('password').value})});const x=await r.json();if(!r.ok)throw Error(x.error||'Anmeldung fehlgeschlagen');token=x.token;sessionStorage.setItem('arena_avatar_token',token);$('password').value='';await refresh();}catch(e){say(e.message)}};
const canvas=$('crop'),ctx=canvas.getContext('2d');
function paint(){ctx.clearRect(0,0,256,256);if(!source)return;const min=Math.max(256/source.width,256/source.height),w=source.width*min*scale,h=source.height*min*scale;ctx.drawImage(source,(256-w)/2+offsetX,(256-h)/2+offsetY,w,h);}
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(f.size>8000000){say('Foto ist zu groß (max. 8 MB).');return;}if(!/^image\/(jpeg|png|webp)$/.test(f.type)){say('Bitte JPG, PNG oder WebP wählen.');return;}const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{source=img;offsetX=offsetY=0;scale=1;$('zoom').value='1';paint();URL.revokeObjectURL(url);say('Ausschnitt wählen und speichern.');};img.onerror=()=>{URL.revokeObjectURL(url);say('Bild konnte nicht geöffnet werden.');};img.src=url;};
$('zoom').oninput=()=>{scale=Number($('zoom').value);paint();};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;const s=256/canvas.getBoundingClientRect().width;offsetX+=(e.clientX-drag.x)*s;offsetY+=(e.clientY-drag.y)*s;drag={x:e.clientX,y:e.clientY};paint();};
canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
$('save').onclick=async()=>{if(!source)return say('Bitte zuerst ein Foto auswählen.');const btn=$('save');btn.disabled=true;btn.textContent='Wird gespeichert …';say('Foto wird gespeichert …');try{let image;for(const quality of [.82,.68,.5,.35]){image=canvas.toDataURL('image/jpeg',quality);if(image.length<460000)break;}if(image.length>=460000)throw Error('Foto konnte nicht ausreichend verkleinert werden.');await api('save',{image});$('preview').src='/api/avatar/image/'+encodeURIComponent(me.code)+'?v='+Date.now();say('✓ Foto gespeichert!');}catch(e){say('Speichern fehlgeschlagen: '+(e.message||'Unbekannter Fehler'));}finally{btn.disabled=false;btn.textContent='Foto speichern';}};
$('remove').onclick=async()=>{try{await api('delete');$('preview').src='/api/avatar/image/'+encodeURIComponent(me.code)+'?v='+Date.now();say('Foto entfernt.');}catch(e){say(e.message)}};
$('logout').onclick=()=>{sessionStorage.removeItem('arena_avatar_token');token='';me=null;show();say('Abgemeldet.');};
if(token)refresh().catch(()=>{token='';sessionStorage.removeItem('arena_avatar_token');say('Bitte anmelden.');});
</script></body></html>
